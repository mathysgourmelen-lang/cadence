name: Build Mac app

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  mac:
    needs: test
    # Apple silicon runner: the Intel queue (macos-15-intel) stopped picking up jobs.
    # It still builds both arm64 and x64 DMGs.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build .dmg (Apple Silicon + Intel)
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          # electron-builder skips signing on pull requests by default, which leaves the bundle
          # unsigned and fails the verify step. The identity is ad-hoc ("-"), so no secrets are involved.
          CSC_FOR_PULL_REQUEST: 'true'
      - name: Verify the app bundle
        run: |
          ls -la dist
          codesign --verify --deep --verbose=2 "dist/mac-arm64/Cadence.app"
          test -f "dist/mac-arm64/Cadence.app/Contents/Resources/app.asar"
      - uses: actions/upload-artifact@v4
        with:
          name: Cadence-dmg
          path: dist/*.dmg
          retention-days: 90
      - name: Read app version
        id: version
        run: echo "tag=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      # Every push to main (or a v* tag) refreshes the release for the version in package.json.
      - name: Publish release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || steps.version.outputs.tag }}
          name: Cadence ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: dist/*.dmg
          overwrite_files: true
          generate_release_notes: true
